name: Change proposal
description: Propose new behavior. Accepted proposals become OpenSpec changes.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what they can't do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What a producer, consumer, or agent would observe.
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Scope section
      description: The section of openspec/scope.md this relates to, if any.
